[project]
name = "meeting-notes-helper"
version = "0.1.0"
description = "Turn meeting recordings or transcripts into structured notes with any OpenAI-compatible LLM provider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.14.4",
    "dotenv>=0.9.9",
    "gradio>=6.15.2",
    "google-genai>=2.30.1",
    "imageio-ffmpeg>=0.5.1",
    "ipykernel>=7.3.0",
    "mcp[cli]>=1.0.0",
    "openai>=2.38.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
include = ["meeting_notes*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "e2e: end-to-end pipeline tests (no network; external boundaries faked)",
]
