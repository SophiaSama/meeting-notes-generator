name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            tesseract-ocr

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run pytest suite
        run: uv run pytest

  docker:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file for Compose validation
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose --profile mcp config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: meeting-notes-helper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container entrypoint imports
        run: |
          docker run --rm meeting-notes-helper:ci \
            uv run python -c "import meeting_notes, main, mcp_server; print('Container smoke check passed')"
